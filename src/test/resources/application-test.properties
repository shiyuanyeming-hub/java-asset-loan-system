# テスト用: H2 を PostgreSQL 互換モードで使う（Docker なしで ./mvnw test が完走する）
# 本番と同じ Flyway のマイグレーションを適用し、JPA は ddl-auto=validate でスキーマを検証する。
spring.datasource.url=jdbc:h2:mem:assetloan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
# H2 自身の方言を使う。PostgreSQL 方言だと悲観ロックで "FOR NO KEY UPDATE" が生成され、
# H2 が解釈できない（本番の PostgreSQL では PostgreSQL 方言が使われる）。
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.loan.default-loan-days=14

logging.level.com.example.assetloan=INFO

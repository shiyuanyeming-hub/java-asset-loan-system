# ===== アプリ共通 =====
spring.application.name=asset-loan-system
server.port=8080

# ===== 既定プロファイル: PostgreSQL（docker compose up -d db で起動） =====
spring.datasource.url=jdbc:postgresql://localhost:5432/asset_loan
spring.datasource.username=asset_loan
spring.datasource.password=asset_loan
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# スキーマは Flyway で管理する（アプリ起動時に自動適用）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 貸出・返却期限の既定日数（備品カテゴリに個別設定が無い場合に使う）
app.loan.default-loan-days=14

logging.level.com.example.assetloan=INFO

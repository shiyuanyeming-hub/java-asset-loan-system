# ローカル確認用プロファイル: H2（PostgreSQL 互換モード）+ ファイル保存
# Docker を起動せずに動かしたいときに使う。DB は ./data/assetloan.mv.db に保存される。
spring.datasource.url=jdbc:h2:file:./data/assetloan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.loan.default-loan-days=14

logging.level.com.example.assetloan=INFO
